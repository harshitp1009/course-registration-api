name: Phase 3 quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt black httpx pytest pytest-cov

      - name: Lint with Black
        run: python -m black --check main.py tests

      - name: Run pytest with at least 80% coverage
        run: python -m pytest -v --cov=main --cov-report=term-missing --cov-fail-under=80

      - name: Start FastAPI and run HTTP integration tests
        shell: bash
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          server_pid=$!
          trap 'cat uvicorn.log; kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/
          API_BASE_URL=http://127.0.0.1:8000 python -m pytest -v
